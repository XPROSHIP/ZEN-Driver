<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEN Driver — Cloud Transfer Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-indigo-400">🚀 ZEN Driver</h1>
            <p class="text-slate-400 text-sm">Geçici indirme bağlantılarını kesintisiz ve yüksek hızlı indirme linkine dönüştürün.</p>
        </div>

        <!-- Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Geçici Bağlantı (URL)</label>
                <input type="text" id="sourceUrl" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>

            <button onclick="generateLink()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                İndirme Linki Oluştur
            </button>
        </div>

        <!-- Output Box -->
        <div id="resultBox" class="hidden space-y-4 pt-4 border-t border-slate-700">
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/50 space-y-3">
                <span class="inline-block px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-medium rounded-full border border-emerald-500/20">
                    ✓ Link Hazır (Resume & Multi-Thread Destekli)
                </span>
                
                <p class="text-xs text-slate-400">Aşağıdaki linki doğrudan tıklayarak indirebilir veya kopyalayıp IDM / JDownloader'a ekleyebilirsiniz:</p>

                <div class="flex gap-2">
                    <input type="text" id="finalUrl" readonly class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-indigo-300 focus:outline-none">
                    <button onclick="copyLink()" class="bg-slate-700 hover:bg-slate-600 text-xs px-4 py-2 rounded-lg font-medium transition">
                        Kopyala
                    </button>
                </div>

                <a id="downloadBtn" href="#" target="_blank" class="block text-center w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                    İndirmeyi Başlat
                </a>
            </div>
        </div>

    </div>

    <script>
        const BACKEND_URL = "https://zen-driver.onrender.com";

        function generateLink() {
            const sourceUrl = document.getElementById("sourceUrl").value.trim();
            if (!sourceUrl) {
                alert("Lütfen geçerli bir URL girin!");
                return;
            }

            const streamUrl = `${BACKEND_URL}/download?url=${encodeURIComponent(sourceUrl)}`;

            document.getElementById("finalUrl").value = streamUrl;
            document.getElementById("downloadBtn").href = streamUrl;
            document.getElementById("resultBox").classList.remove("hidden");
        }

        function copyLink() {
            const copyText = document.getElementById("finalUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("İndirme linki panoya kopyalandı! IDM'ye yapıştırabilirsiniz.");
        }
    </script>

</body>
</html>
